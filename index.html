  var STORAGE_KEY = 'wb_quiz_history_v1';
  function loadStats(){
    try{ var s=localStorage.getItem(STORAGE_KEY); return s?JSON.parse(s):{rounds:0,total:0,right:0}; }catch(e){ return {rounds:0,total:0,right:0}; }
  }
  function saveStats(st){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(st)); }catch(e){} }
  function renderStats(){
    var st = loadStats();
    $('statRounds').textContent = st.rounds;
    $('statAnswered').textContent = st.total;
    $('statPct').textContent = st.total ? Math.round(st.right/st.total*100)+'%' : '\u2014';
  }
  var sessionStartTs = 0;
  var pendingEntry = null; // 待签名落盘的快照

  function recordRound(total, right){
    var st = loadStats();
    st.rounds += 1;
    st.total += total;
    st.right += right;
    saveStats(st);
    renderStats();

    var dur = sessionStartTs ? Math.round((Date.now() - sessionStartTs)/1000) : 0;
    var cats = chosenCats.slice();
    pendingEntry = {
      id: 'r' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
      ts: Date.now(),
      total: total,
      right: right,
      pct: total ? Math.round(right/total*100) : 0,
      duration: dur,
      cats: cats,
      sig: ''
    };
    // 弹签名输入：跳过/确认 都走落盘逻辑
    showSigModal(function(){
      var arr = loadHistory();
      arr.push(pendingEntry);
      if(arr.length > 200) arr = arr.slice(arr.length-200);
      saveHistory(arr);
      renderHistory();
      pendingEntry = null;
    });
  }

  // ============ 导入恢复 ============
  function importData(file){
    var reader = new FileReader();
    reader.onload = function(e){
      try{
        var data = JSON.parse(e.target.result);
        if(!data || data._type !== 'wb_quiz_backup') throw new Error('\u6587\u4ef6\u683c\u5f0f\u4e0d\u5bf9');
        if(!data.stats || typeof data.stats.rounds !== 'number') throw new Error('\u6570\u636e\u4e0d\u5b8c\u6574');
        showConfirm('\u5c06\u8986\u76d6\u5f53\u524d\u6570\u636e\uff1a\u7d2f\u8ba1 '+loadStats().rounds+' \u8f6e / '+loadStats().total+' \u9898\u3002\n\u5bfc\u5165\u6587\u4ef6\uff1a\u7d2f\u8ba1 '+data.stats.rounds+' \u8f6e / '+data.stats.total+' \u9898\u3002\u662f\u5426\u7ee7\u7eed\uff1f', function(){
          saveStats(data.stats);
          renderStats();
          $('backupHint').textContent = '\u5df2\u6062\u590d\uff1a\u7d2f\u8ba1 '+data.stats.rounds+' \u8f6e / '+data.stats.total+' \u9898 / \u6b63\u786e\u7387 '+(data.stats.total?Math.round(data.stats.right/data.stats.total*100)+'%':'\u2014');
        }, '\u5bfc\u5165\u6062\u590d');
      }catch(err){
        showAlert('\u5bfc\u5165\u5931\u8d25\uff1a'+err.message);
      }
    };
    reader.readAsText(file);
  }

  // ============ 历史成绩记录 ============
  var HIST_KEY = 'wb_quiz_history_log_v1';
  function loadHistory(){
    try{ var s=localStorage.getItem(HIST_KEY); return s?JSON.parse(s):[]; }catch(e){ return []; }
  }
  function saveHistory(arr){ try{ localStorage.setItem(HIST_KEY, JSON.stringify(arr)); }catch(e){} }

  function fmtDuration(sec){
    if(!sec || sec<0) return '—';
    var m=Math.floor(sec/60), s=sec%60;
    return m>0 ? (m+'分'+s+'秒') : (s+'秒');
  }
  function fmtDateTime(ts){
    var d=new Date(ts), p=function(n){return n<10?('0'+n):n;};
    return d.getMonth()+1+'-'+d.getDate()+' '+p(d.getHours())+':'+p(d.getMinutes());
  }
  function rankHistory(arr){
    var sorted = arr.slice().sort(function(a,b){
        if(b.pct!==a.pct) return b.pct-a.pct;
        return (a.duration||1e9) - (b.duration||1e9);
      });
    var rank = {};
    sorted.forEach(function(r,i){ rank[r.id] = i+1; });
    return {sorted: sorted, rank: rank};
  }
  function renderHistory(){
    var arr = loadHistory();
    var box = $('histList');
    if(!arr.length){
      box.innerHTML = '<div class="hist-empty">还没有成绩记录，去"开始答题"吧☕</div>';
      if($('histHint')) $('histHint').textContent = '';
      return;
    }
    var R = rankHistory(arr);
    var h = '';
    R.sorted.forEach(function(r){
      var badgeCls = '', badgeText = R.rank[r.id];
      if(R.rank[r.id]===1){ badgeCls='gold'; }
      else if(R.rank[r.id]===2){ badgeCls='silver'; }
      else if(R.rank[r.id]===3){ badgeCls='bronze'; }
      var catsText = r.cats && r.cats.length ? (r.cats.length===1?r.cats[0]:('选 '+r.cats.length+'个章节')) : '全题库';
      var sig = r.sig || '';
      var sigText = sig ? ('✓ '+escapeHtml(sig)) : '+ 加签名';
      var sigHtml = '<span class="hist-sig '+(sig?'':'empty')+'" data-edit-id="'+r.id+'" data-action="profile" title="点击查看历史排名">'+sigText+'</span>'
        + '<span class="hist-sig-action" data-edit-id="'+r.id+'" data-action="edit" title="编辑签名">✎</span>'
        + (sig ? '<span class="hist-sig-action danger" data-edit-id="'+r.id+'" data-action="delete" title="清除签名">✕</span>' : '');
      h += '<div class="hist-item">'
         +   '<div class="left">'
         +     '<div class="rank-badge '+badgeCls+'">'+badgeText+'</div>'
         +     '<div style="min-width:0">'
         +       '<div style="font-weight:700">'+r.right+'/'+r.total+' <span style="color:var(--cream-dim);font-weight:400;font-size:11px">· '+fmtDateTime(r.ts)+'</span></div>'
         +       '<div class="meta">'+catsText+' · 用时 '+fmtDuration(r.duration)+sigHtml+'</div>'
         +     '</div>'
         +   '</div>'
         +   '<div class="right-meta">'
         +     '<div class="pct">'+r.pct+'%</div>'
         +     '<div class="pct-bar" style="margin-top:3px"><div class="f" style="width:'+r.pct+'%"></div></div>'
         +   '</div>'
         + '</div>';
    });
    box.innerHTML = h;
    bindSigClicks();
    // 不再写底部提示文字（与点击标题弹窗的全量历史成绩信息重复）
    if($('histHint')) $('histHint').textContent = '';
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; });
  }

  function showFullHistory(){
    var arr = loadHistory();
    if(!arr.length){
      showAlert('暂无历史成绩，去答题吧 ☕');
      return;
    }
    var total = arr.length;
    var sumRight = 0, sumTotal = 0, sumDur = 0;
    var max = {pct:-1}, min = {pct:101};
    var sigSet = {};
    var first = arr.slice().sort(function(a,b){return a.ts-b.ts;})[0];
    var last = arr.slice().sort(function(a,b){return b.ts-a.ts;})[0];
    arr.forEach(function(r){
      sumRight += r.right; sumTotal += r.total; sumDur += (r.duration||0);
      if(r.pct > max.pct) max = r;
      if(r.pct < min.pct) min = r;
      var s = (r.sig||'').trim();
      if(s) sigSet[s] = (sigSet[s]||0) + 1;
    });
    var avgPct = sumTotal ? Math.round(sumRight/sumTotal*100) : 0;
    var avgDur = Math.round(sumDur/total);
    var sigCount = Object.keys(sigSet).length;

    // 签名排行
    var sigList = Object.keys(sigSet).map(function(s){
      var ms = arr.filter(function(r){return (r.sig||'').trim()===s;});
      var sr=0, st=0;
      ms.forEach(function(r){ sr+=r.right; st+=r.total; });
      return {name:s, count:ms.length, pct:st?Math.round(sr/st*100):0};
    }).sort(function(a,b){ if(b.pct!==a.pct) return b.pct-a.pct; return b.count-a.count; });

    // 按正确率排名
    var sorted = arr.slice().sort(function(a,b){
      if(b.pct!==a.pct) return b.pct-a.pct;
      return (a.duration||1e9)-(b.duration||1e9);
    });
    var rank = {};
    sorted.forEach(function(r,i){ rank[r.id] = i+1; });

    var rowsHtml = sorted.map(function(r){
      var rc = rank[r.id];
      var bc = '';
      if(rc===1) bc='gold'; else if(rc===2) bc='silver'; else if(rc===3) bc='bronze';
      var sig = r.sig||'';
      var sigBadge = sig
        ? '<span class="prof-pill">✓ '+escapeHtml(sig)+'</span>'

      return '<div class="prof-row">'
        + '<div class="rank-badge '+bc+'">'+rc+'</div>'
        + '<span class="prof-pct">'+r.pct+'%</span>'
        + '<span class="prof-meta">'+r.right+'/'+r.total+' · '+fmtDateTime(r.ts)+' · 用时 '+fmtDuration(r.duration)+'</span>'
        + sigBadge
        + '</div>';
    }).join('');

    var sigRowsHtml = sigList.map(function(s){
      return '<div class="prof-row"><span class="prof-pct">'+s.pct+'%</span><span class="prof-meta"><b>'+escapeHtml(s.name)+'</b> · '+s.count+' 轮 · 平均 '+s.pct+'%</span></div>';
    }).join('');

    var maxRow = max.pct>=0 ? '<div class="prof-summary-item"><span class="lbl-best">最佳</span><span>'+max.right+'/'+max.total+' · '+max.pct+'%</span></div>' : '';
    var minRow = min.pct<=100 ? '<div class="prof-summary-item"><span class="lbl-worst">最差</span><span>'+min.right+'/'+min.total+' · '+min.pct+'%</span></div>' : '';

    var html = ''
      + '<div class="modal-box prof-box">'
      + '<div class="prof-head">'
      +   '<span class="prof-tag">历史</span>'
      +   '<span class="prof-name">全量历史成绩</span>'
      +   '<span class="prof-head-stat">共 '+total+' 轮</span>'
      + '</div>'
      + '<div class="prof-stats">'
      +   '<div class="prof-stat"><span class="v">'+total+'</span><span class="l">总轮次</span></div>'
      +   '<div class="prof-stat"><span class="v">'+avgPct+'%</span><span class="l">总平均</span></div>'
      +   '<div class="prof-stat"><span class="v">'+fmtDuration(avgDur)+'</span><span class="l">平均用时</span></div>'
      +   '<div class="prof-stat"><span class="v">'+sigCount+'</span><span class="l">签名人数</span></div>'
      + '</div>'
      + '<div class="prof-summary">'
      +   maxRow
      +   minRow
      + '</div>'
      + (sigCount ? '<div class="prof-list-title">签名排行</div><div class="prof-list">'+sigRowsHtml+'</div>' : '')
      + '<div class="prof-list-title">全部轮次（按正确率排名）</div>'
      + '<div class="prof-list prof-list-all">'+rowsHtml+'</div>'
      + '<div class="modal-actions prof-actions">'
      +   '<button class="btn ghost" id="fullClose">关闭</button>'
      + '</div></div>';

    var box = document.createElement('div');
    box.className = 'modal-mask';
    box.innerHTML = html;
    document.body.appendChild(box);
    document.getElementById('fullClose').onclick = function(){ box.parentNode && box.parentNode.removeChild(box); };
    box.onclick = function(e){ if(e.target===box) box.parentNode && box.parentNode.removeChild(box); };

      el.onclick = function(e){
        e.stopPropagation();
        var id = el.getAttribute('data-edit-id');
        var action = el.getAttribute('data-action') || 'edit';
        if(action === 'delete'){
          var arr = loadHistory();
          var entry = null;
          for(var i=0;i<arr.length;i++){ if(arr[i].id===id){ entry=arr[i]; break; } }
          if(!entry) return;
          showConfirm('确认清除「'+entry.sig+'」这个签名吗？', function(){
            entry.sig = '';
            saveHistory(arr);
            renderHistory();
          }, '清除签名');
        } else if(action === 'edit'){
          // ✎ 编辑按钮：直接打开签名编辑 modal
          editSigById(id);
        } else if(action === 'profile'){
          // 徽章本身：弹出签名历史排名卡片
          var arr2 = loadHistory();
          var entry2 = null;
          for(var i=0;i<arr2.length;i++){ if(arr2[i].id===id){ entry2=arr2[i]; break; } }
          if(!entry2 || !entry2.sig) return;
          showSigProfile(entry2.sig, id);
        }
      };
    });
  }

  function clearHistory(){
    var arr = loadHistory();
    if(!arr.length){ showAlert('没有可清除的历史记录'); return; }
    showConfirm('确定要清空本机的全部 '+arr.length+' 轮记录吗？\n建议先导出备份，清除后不可恢复。', function(){
      try{ localStorage.removeItem(HIST_KEY); }catch(e){}
      renderHistory();
      if($('histHint')) $('histHint').textContent = '已清空 '+arr.length+' 轮历史记录';
    }, '清除历史成绩');
  }

  $('btnClearHistory').onclick = clearHistory;
  $('histTitle').onclick = showFullHistory;
  renderHistory();

  // ---- 首页构建 ----
  $('bankCount').textContent=BANK.length;
  var chosenCount=20, chosenCats=[];
  var numOpts=[{n:10,l:'快测'},{n:20,l:'小测'},{n:30,l:'中测'},{n:50,l:'大测'},{n:BANK.length,l:'全题库'}];
  // 若题库小于最大档，自动收敛档位
  numOpts=numOpts.filter(function(o){return o.n<=BANK.length;});
  if(!numOpts.length)numOpts=[{n:BANK.length,l:'全题库'}];
  if(chosenCount>numOpts[numOpts.length-1].n)chosenCount=numOpts[numOpts.length-1].n;
    var numBox=$('numPick');
  numOpts.forEach(function(o){
    var d=document.createElement('div');d.className='num'+(o.n===chosenCount?' on':'');d.innerHTML='<b>'+o.n+'</b>'+o.l;
    d.onclick=function(){chosenCount=o.n;Array.prototype.forEach.call(numBox.children,function(c,i){c.className='num'+(numOpts[i].n===chosenCount?' on':'');});};
    numBox.appendChild(d);
  });
  var catBox=$('catPick');
  CATS.forEach(function(c){
    var ch=document.createElement('div');ch.className='chip';ch.textContent=c;
    ch.onclick=function(){var i=chosenCats.indexOf(c);if(i>=0)chosenCats.splice(i,1);else chosenCats.push(c);
      Array.prototype.forEach.call(catBox.children,function(x){x.className='chip'+(chosenCats.indexOf(x.textContent)>=0?' on':'');});};
    catBox.appendChild(ch);
  });
  function pool(){return chosenCats.length?BANK.filter(function(b){return chosenCats.indexOf(b.cat)>=0;}):BANK.slice();}

  // ---- 会话 ----
  var session=[],answers=[],idx=0,wrongs=[];
  var LETTERS=['A','B','C','D'];

  function start(wrongQs){
    var arr = wrongQs? BANK.filter(function(b){return wrongQs.indexOf(b.q)>=0;}) : pool();
    arr=arr.slice();
    if(!wrongQs){ arr=shuffle(arr); if(arr.length>chosenCount)arr=arr.slice(0,chosenCount); }
    if(!arr.length){showAlert('\u5f53\u524d\u8303\u56f4\u6ca1\u6709\u53ef\u51fa\u9898\u7684\u9898\u76ee');return;}
    sessionStartTs = Date.now();
    arr.forEach(shuffleOpts);
    session=arr;answers=new Array(session.length).fill(null);idx=0;
    wrongs=[];switchView('viewQuiz');render();
  }

  function render(){
    var total=session.length;
    $('qTotal').textContent=total;$('qNow').textContent=idx+1;
    var done=answers.filter(function(a){return a!==null;}).length;
    $('scoreLive').textContent='已答 '+done+' / '+total;
    $('progFill').style.width=((idx+1)/total*100)+'%';
    var fb=$('fbBox');fb.className='feedback';fb.innerHTML='';
    var b=session[idx];
    $('qTag').textContent=b.cat;
    $('catNow').textContent='章节：'+b.cat+'　·　本轮 '+total+' 题';
    $('qText').textContent=''+(idx+1)+'. '+b.q;
    var list=$('optList');list.innerHTML='';
    b.opts.forEach(function(o,oi){
      var d=document.createElement('div');d.className='opt';d.innerHTML='<span class="let">'+LETTERS[oi]+'</span><span>'+o+'</span>';
      d.onclick=function(){if(answers[idx]===null){answers[idx]=oi;mark(idx,true);}};
      list.appendChild(d);
    });
    if(answers[idx]!==null)mark(idx);
    $('btnPrev').style.visibility=idx===0?'hidden':'visible';
    $('btnNext').textContent=(idx===total-1)?'查看成绩 ✓':'下一题 →';
  }

  function mark(i,scroll){
    var b=session[i],oi=answers[i],cur=b.ans;
    var els=Array.prototype.slice.call($('optList').children);
    var fb=$('fbBox');
    els.forEach(function(e,j){
      e.classList.remove('right','wrong','dim');
      if(j===cur)e.classList.add('right');
      else if(j===oi)e.classList.add('wrong');
      else e.classList.add('dim');
    });
    if(oi===cur){fb.className='feedback ok show';fb.innerHTML='<b>✓ 回答正确</b>　答对了，继续保持。';}
    else{fb.className='feedback no show';fb.innerHTML='<b>✗ 答错了</b><span class="right-ans">正确答案：【'+LETTERS[cur]+'】'+b.opts[cur]+'</span>';}
    var done=answers.filter(function(a){return a!==null;}).length;
    $('scoreLive').textContent='已答 '+done+' / '+session.length;
    $('btnNext').textContent=(i===session.length-1)?'查看成绩 ✓':'下一题 →';
    if(scroll){setTimeout(function(){fb.scrollIntoView({behavior:'smooth',block:'nearest'});},60);}
  }

  $('btnPrev').onclick=function(){if(idx>0){idx--;render();}};
  $('btnNext').onclick=function(){
    if(answers[idx]===null){showAlert('请先选择一个答案再继续');return;}
    if(idx<session.length-1){idx++;render();}else{showResult();}
  };
  $('btnQuit').onclick=function(){showConfirm('提前结束本轮？将按已答题目计分。', function(){showResult();});};

  function showResult(){
    var total=session.length,right=0;wrongs=[];
    session.forEach(function(b,i){if(answers[i]===b.ans)right++;else wrongs.push(b);});
    var pct=total?Math.round(right/total*100):0;
    $('scorePct').textContent=pct+'%';$('scoreFrac').textContent=right+' / '+total;
    $('ring').style.setProperty('--p',(pct*3.6)+'deg');
    var s='<div class="row2"><span>作答题数</span><span>'+total+'</span></div>'
      +'<div class="row2"><span>答对</span><span style="color:#7fb069">'+right+'</span></div>'
      +'<div class="row2"><span>答错</span><span style="color:#e06b5b">'+(total-right)+'</span></div>'
      +'<div class="row2"><span>正确率</span><span style="color:#c89a63">'+pct+'%</span></div>';
    var cmap={};session.forEach(function(b,i){(cmap[b.cat]=cmap[b.cat]||{t:0,r:0});cmap[b.cat].t++;if(answers[i]===b.ans)cmap[b.cat].r++;});
    s+='<div class="lbl2">章节正确率</div>';
    Object.keys(cmap).forEach(function(c){var v=cmap[c],pp=Math.round(v.r/v.t*100);
      s+='<div class="csrow"><span class="name">'+c+'</span><div class="track"><div class="fill" style="width:'+pp+'%"></div></div><span class="pct">'+pp+'%</span></div>';});
    $('resStats').innerHTML=s;
    $('btnShowReview').textContent=wrongs.length?'错题回顾（'+wrongs.length+'）':'展开错题';
    $('btnRetryWrong').style.display=wrongs.length?'':'none';
    var rv=$('reviewBox');rv.classList.add('hidden');rv.innerHTML='';
    recordRound(total, right);
    switchView('viewResult');
  }
  var reviewOpen=false;
  $('btnShowReview').onclick=function(){
    var rv=$('reviewBox');
    if(reviewOpen){rv.classList.add('hidden');reviewOpen=false;this.textContent=wrongs.length?'错题回顾（'+wrongs.length+'）':'错题回顾';return;}
    if(!rv.innerHTML){
      if(!wrongs.length){rv.innerHTML='<div class="empty-note">太棒了，本轮没有错题 ☕</div>';}
      else{var h='';wrongs.forEach(function(b){h+='<div class="rev-item"><div class="rcat">'+b.cat+'</div><div class="rq">'+b.q+'</div><div class="ra">✔ 正确答案：【'+LETTERS[b.ans]+'】'+b.opts[b.ans]+'</div></div>';});rv.innerHTML=h;}
    }
    rv.classList.remove('hidden');reviewOpen=true;this.textContent='收起错题 ▲';
  };
  $('btnRetryWrong').onclick=function(){if(!wrongs.length)return;reviewOpen=false;$('reviewBox').classList.add('hidden');start(wrongs.map(function(b){return b.q;}));};
  $('btnAgain').onclick=function(){reviewOpen=false;$('reviewBox').classList.add('hidden');start();};
  $('btnHome').onclick=function(){switchView('viewStart');};
  $('btnStart').onclick=function(){start();};
  $('btnAll').onclick=function(){chosenCats=[];Array.prototype.forEach.call(catBox.children,function(x){x.className='chip';});start();};
})();
</script>
</body>
</html>
